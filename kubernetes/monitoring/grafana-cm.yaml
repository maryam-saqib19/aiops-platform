apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  aiops-platform.json: |
    {
      "title": "AIOps Platform Overview",
      "uid": "aiops-overview",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(flask_http_request_total{namespace='production'}[5m])) by (status)",
              "legendFormat": "Status {{status}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "AIOps Anomaly Score",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "aiops_anomaly_score",
              "legendFormat": "Anomaly Score"
            }
          ],
          "options": {
            "thresholds": {
              "steps": [
                { "value": 0, "color": "green" },
                { "value": 0.5, "color": "yellow" },
                { "value": 0.8, "color": "red" }
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "CPU Usage — Production",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "avg(rate(container_cpu_usage_seconds_total{namespace='production',container!='POD'}[5m]))",
              "legendFormat": "Avg CPU"
            }
          ]
        },
        {
          "id": 4,
          "title": "Memory Usage — Production",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "avg(container_memory_working_set_bytes{namespace='production',container!='POD'})",
              "legendFormat": "Avg Memory"
            }
          ]
        },
        {
          "id": 5,
          "title": "Pod Restart Count",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace='production'})",
              "legendFormat": "Total Restarts"
            }
          ]
        }
      ]
    }

